version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face-eye-tracking-backend
    restart: unless-stopped
    environment:
      - PORT=8000
    volumes:
      - ./assets:/app/assets
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: face-eye-tracking-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
